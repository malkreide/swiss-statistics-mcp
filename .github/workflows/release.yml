name: Release

# Cutting a release is a single action: push a version tag.
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# That triggers this workflow, which builds the package, publishes it to PyPI
# via Trusted Publishing (OIDC — no stored token), and creates the matching
# GitHub Release. See RELEASING.md for the one-time PyPI setup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure a matching Trusted Publisher on PyPI for this environment
    # (see RELEASING.md). This is the only job that needs the one-time setup.
    environment:
      name: pypi
      url: https://pypi.org/project/swiss-statistics-mcp/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    # Independent of pypi-publish, so the GitHub Release is always created even
    # before Trusted Publishing is configured (that job can be re-run later).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
