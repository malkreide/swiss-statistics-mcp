name: Release

# Cutting a release is a single action: push a version tag.
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# That triggers this workflow, which builds the package, publishes it to PyPI
# via Trusted Publishing (OIDC — no stored token), creates the matching GitHub
# Release, and publishes the server to the MCP Registry.
#
# This is the ONLY workflow that publishes. It deliberately triggers on the tag
# push rather than on `release: published`, because the GitHub Release created
# below is created with the GITHUB_TOKEN, and releases created that way do not
# trigger further workflow runs.
#
# See RELEASING.md for the one-time PyPI setup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    # The PyPI Trusted Publisher must name THIS workflow file (release.yml) and
    # this environment (pypi). A mismatch fails with `invalid-publisher`.
    environment:
      name: pypi
      url: https://pypi.org/project/swiss-statistics-mcp/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    # Independent of pypi-publish, so the GitHub Release is always created even
    # if Trusted Publishing is misconfigured (that job can be re-run later).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  publish-mcp:
    name: Publish to MCP Registry
    # Runs only after PyPI has the package, since the registry entry points at
    # the published PyPI artefact.
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for MCP Registry Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Sync server.json version to the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
