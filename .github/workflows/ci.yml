name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # ruff kommt exakt gepinnt aus dem `dev`-Extra in pyproject.toml. Kein
      # zweiter Pin-Schritt hier: Zwei Stellen fuer dieselbe Version driften
      # auseinander, und die CI merkt es nicht, weil sie sich selbst
      # ueberschreibt — lokal laeuft dann ein anderes Gate als hier.
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Upgrade pip first so its own version is not flagged by pip-audit;
          # the host-tool's CVEs are not part of our supply chain.
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static security scan (bandit)
        run: bandit -r src/ -ll

      - name: Dependency CVE scan (pip-audit)
        # `--strict` is intentionally NOT set: pip-audit's strict mode treats
        # the unaudit-able editable install of our own package as a hard
        # error, which makes the gate constantly red on any editable layout.
        # The default mode still exits 1 on real CVE findings in deps —
        # that is the gate we actually want.
        run: pip-audit
